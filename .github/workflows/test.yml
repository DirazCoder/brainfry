name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            archive_name: linux-arm64

          - target: x86_64-apple-darwin
            os: macos-26-intel
            archive_name: macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: macos-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: windows-x86_64

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive_name: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p bfc -p bfrun -p bfnative -p bfinterp -p bfwasm
          # bfjit temporarily disabled, see step below
          # cargo build --release --target ${{ matrix.target }} -p bfjit

      # bfjit temporarily disabled
      # - name: codesign bfjit for JIT entitlement (macOS)
      #   if: runner.os == 'macOS'
      #   shell: bash
      #   run: |
      #     BIN="target/${{ matrix.target }}/release"
      #     cat > /tmp/bfjit.entitlements <<'EOF'
      #     <?xml version="1.0" encoding="UTF-8"?>
      #     <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      #     <plist version="1.0">
      #     <dict>
      #         <key>com.apple.security.cs.allow-jit</key>
      #         <true/>
      #     </dict>
      #     </plist>
      #     EOF
      #     codesign --sign - --options runtime --entitlements /tmp/bfjit.entitlements --force "$BIN/bfjit"

      - name: write test programs
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          mkdir -p "$BIN/tests"

          # hello world
          printf '++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.' > "$BIN/tests/hello.bf"

          # 8-bit wraparound: 256 '+' should print byte 0
          python3 -c "print('+' * 256 + '.')" > "$BIN/tests/wrap.bf" 2>/dev/null || \
          awk 'BEGIN{s="";for(i=0;i<256;i++)s=s"+"; print s"."}' > "$BIN/tests/wrap.bf"

          # left-of-zero underflow: must error, nonzero exit
          printf '<' > "$BIN/tests/underflow.bf"

          # EOF-on-input leaves cell untouched: +++ , . should print byte 3
          printf '+++,.' > "$BIN/tests/eof.bf"

          # tape growth past 30000 cells
          awk 'BEGIN{s="";for(i=0;i<30005;i++)s=s">"; print s"+."}' > "$BIN/tests/grow.bf"

      - name: run hello world on all four execution paths and compare
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""
          [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"

          out_interp=$(./bfinterp$EXT tests/hello.bf)
          echo "bfinterp:  $out_interp"

          ./bfc$EXT tests/hello.bf tests/hello.bfry
          out_bytecode=$(./bfrun$EXT tests/hello.bfry)
          echo "bfrun:     $out_bytecode"

          # bfjit temporarily disabled
          # out_jit=$(./bfjit$EXT tests/hello.bf)
          # echo "bfjit:     $out_jit"

          ./bfnative$EXT tests/hello.bf -o tests/hello_native$EXT
          chmod +x tests/hello_native$EXT 2>/dev/null || true
          out_native=$(./tests/hello_native$EXT)
          echo "bfnative:  $out_native"

          test "$out_interp" = "Hello World!" || { echo "FAIL: bfinterp wrong output"; exit 1; }
          test "$out_interp" = "$out_bytecode" || { echo "FAIL: bfrun disagrees with bfinterp"; exit 1; }
          # test "$out_interp" = "$out_jit"      || { echo "FAIL: bfjit disagrees with bfinterp"; exit 1; }
          test "$out_interp" = "$out_native"   || { echo "FAIL: bfnative disagrees with bfinterp"; exit 1; }
          echo "PASS: all execution paths (bfjit excluded) agree on hello world"

      # Temporary: isolates why bfnative's macOS binary gets SIGKILLed.
      # Runs codesign verification (same check the kernel does) before
      # execution, then captures amfid/kernel denial logs around the
      # actual run so the failure reason can't get lost in a truncated
      # GHA log or swallowed by set -e.
      - name: debug bfnative macOS crash
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          BIN="target/${{ matrix.target }}/release"
          cd "$BIN"

          echo "::group::file(1)"
          file tests/hello_native
          echo "::endgroup::"

          echo "::group::codesign -dvvv (static signature inspection)"
          codesign -dvvv tests/hello_native
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::codesign --verify --deep --strict --verbose=4 (kernel-equivalent check)"
          codesign --verify --deep --strict --verbose=4 tests/hello_native
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::spctl -a -vv (Gatekeeper assessment)"
          spctl -a -vv tests/hello_native
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::running the binary directly, capturing exit code"
          START_TS=$(date -u +"%Y-%m-%d %H:%M:%S")
          ./tests/hello_native
          RUN_EXIT=$?
          echo "run exit code: $RUN_EXIT"
          echo "::endgroup::"

          if [ "$RUN_EXIT" -ne 0 ]; then
            echo "::group::log show (kernel/amfid denial reason, since $START_TS)"
            # AMFI/codesigning kills show up in the unified log even when
            # nothing is written to stdout/stderr. --info/--debug widen
            # the net since denial messages are sometimes below default
            # verbosity.
            log show --start "$START_TS" --predicate \
              '(process == "amfid") OR (process == "kernel" AND eventMessage CONTAINS "hello_native") OR (eventMessage CONTAINS "hello_native")' \
              --info --debug 2>&1 | tail -200
            echo "::endgroup::"

            echo "::group::log show (broader taskgated/Security fallback)"
            log show --start "$START_TS" --predicate \
              'subsystem == "com.apple.securityd" OR process == "taskgated" OR process == "syspolicyd"' \
              --info --debug 2>&1 | tail -200
            echo "::endgroup::"
          fi
          set -e

      - name: 8-bit wraparound
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          byte=$(./bfinterp$EXT tests/wrap.bf | od -An -tu1 | tr -d ' ')
          test "$byte" = "0" || { echo "FAIL: expected wraparound to 0, got $byte"; exit 1; }
          echo "PASS: 256 increments wrapped to 0"

      - name: EOF leaves cell untouched
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          byte=$(./bfinterp$EXT tests/eof.bf < /dev/null | od -An -tu1 | tr -d ' ')
          test "$byte" = "3" || { echo "FAIL: expected 3 unchanged, got $byte"; exit 1; }
          echo "PASS: EOF left cell untouched"

      - name: tape grows past 30000 cells
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          byte=$(./bfinterp$EXT tests/grow.bf | od -An -tu1 | tr -d ' ')
          test "$byte" = "1" || { echo "FAIL: expected 1 after growth, got $byte"; exit 1; }
          echo "PASS: tape grew correctly past 30000 cells"

      - name: left-of-zero underflow errors correctly
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          if ./bfinterp$EXT tests/underflow.bf; then
            echo "FAIL: expected nonzero exit code on underflow"
            exit 1
          fi
          echo "PASS: underflow correctly returned nonzero exit"

      - name: --optimize is semantics-preserving
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          for f in tests/hello.bf tests/wrap.bf tests/grow.bf; do
            a=$(./bfinterp$EXT "$f" < /dev/null)
            b=$(./bfinterp$EXT --optimize "$f" < /dev/null)
            test "$a" = "$b" || { echo "FAIL: --optimize changed output for $f"; exit 1; }
          done
          echo "PASS: --optimize matches naive output on all cases"
