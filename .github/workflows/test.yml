name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            archive_name: linux-arm64

          - target: x86_64-apple-darwin
            os: macos-26-intel
            archive_name: macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: macos-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: windows-x86_64

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive_name: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p bfc -p bfrun -p bfnative -p bfinterp -p bfwasm
          # bfjit temporarily disabled, see step below
          # cargo build --release --target ${{ matrix.target }} -p bfjit

      # bfjit temporarily disabled
      # - name: codesign bfjit for JIT entitlement (macOS)
      #   if: runner.os == 'macOS'
      #   shell: bash
      #   run: |
      #     BIN="target/${{ matrix.target }}/release"
      #     cat > /tmp/bfjit.entitlements <<'EOF'
      #     <?xml version="1.0" encoding="UTF-8"?>
      #     <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      #     <plist version="1.0">
      #     <dict>
      #         <key>com.apple.security.cs.allow-jit</key>
      #         <true/>
      #     </dict>
      #     </plist>
      #     EOF
      #     codesign --sign - --options runtime --entitlements /tmp/bfjit.entitlements --force "$BIN/bfjit"

      - name: write test programs
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          mkdir -p "$BIN/tests"

          # hello world
          printf '++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.' > "$BIN/tests/hello.bf"

          # 8-bit wraparound: 256 '+' should print byte 0
          python3 -c "print('+' * 256 + '.')" > "$BIN/tests/wrap.bf" 2>/dev/null || \
          awk 'BEGIN{s="";for(i=0;i<256;i++)s=s"+"; print s"."}' > "$BIN/tests/wrap.bf"

          # left-of-zero underflow: must error, nonzero exit
          printf '<' > "$BIN/tests/underflow.bf"

          # EOF-on-input leaves cell untouched: +++ , . should print byte 3
          printf '+++,.' > "$BIN/tests/eof.bf"

          # tape growth past 30000 cells
          awk 'BEGIN{s="";for(i=0;i<30005;i++)s=s">"; print s"+."}' > "$BIN/tests/grow.bf"

      - name: run hello world on all four execution paths and compare
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""
          [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"

          out_interp=$(./bfinterp$EXT tests/hello.bf)
          echo "bfinterp:  $out_interp"

          ./bfc$EXT tests/hello.bf tests/hello.bfry
          out_bytecode=$(./bfrun$EXT tests/hello.bfry)
          echo "bfrun:     $out_bytecode"

          # bfjit temporarily disabled
          # out_jit=$(./bfjit$EXT tests/hello.bf)
          # echo "bfjit:     $out_jit"

          ./bfnative$EXT tests/hello.bf -o tests/hello_native$EXT
          chmod +x tests/hello_native$EXT 2>/dev/null || true

          # Structural validation before execution: catches segment-table /
          # code-signature mismatches (e.g. execSegBase/execSegLimit
          # pointing at the wrong offsets) that codesign and rcodesign
          # don't check but the kernel's exec-segment validator does. This
          # fails with the exact bad field instead of a bare SIGKILL.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            python3 "$GITHUB_WORKSPACE/scripts/validate_macho.py" tests/hello_native$EXT \
              || { echo "FAIL: hello_native failed structural validation (see above)"; exit 1; }
          fi

          out_native=$(./tests/hello_native$EXT)
          echo "bfnative:  $out_native"

          test "$out_interp" = "Hello World!" || { echo "FAIL: bfinterp wrong output"; exit 1; }
          test "$out_interp" = "$out_bytecode" || { echo "FAIL: bfrun disagrees with bfinterp"; exit 1; }
          # test "$out_interp" = "$out_jit"      || { echo "FAIL: bfjit disagrees with bfinterp"; exit 1; }
          test "$out_interp" = "$out_native"   || { echo "FAIL: bfnative disagrees with bfinterp"; exit 1; }
          echo "PASS: all execution paths (bfjit excluded) agree on hello world"

      # Temporary: isolates why bfnative's macOS binary gets SIGKILLed.
      # Two prior rounds of hello_native-only diagnostics (structural
      # validation, hex dump, rcodesign, codesign --verify, a single
      # re-sign control) all came back clean and still couldn't explain
      # the kill, including after fixing a real CS_LINKER_SIGNED gap that
      # turned out not to be the cause. This round adds the controls that
      # were still missing: an independent cc-compiled binary with zero
      # bfnative code in it (as both a plain ad-hoc build and a
      # codesign -s --resigned copy, to separate "this runner kills ALL
      # ad-hoc binaries" from "this runner kills hello_native
      # specifically"), system policy state (SIP, Gatekeeper switch, MDM
      # profiles) that no prior round checked, a live `log stream`
      # instead of a post-hoc `log show` (which can miss/reorder entries
      # near the kill), and diagnostic-report (.ips) capture.
      - name: debug bfnative macOS crash
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          BIN="target/${{ matrix.target }}/release"

          # ---- system policy state, checked once up front ----
          # None of the existing diagnostics below ask whether this
          # *runner image* is doing something to ad-hoc binaries in
          # general (an MDM-pushed configuration profile, SIP state,
          # a non-default AMFI/Gatekeeper master switch) as opposed to
          # something specific to our file's bytes. Check that first.
          echo "::group::system policy state (SIP, Gatekeeper master switch, MDM profiles)"
          echo "csrutil status:"
          csrutil status 2>&1
          echo
          echo "spctl --status:"
          spctl --status 2>&1
          echo
          echo "spctl master-disable check (gatekeeper --global-enable state via defaults):"
          defaults read /Library/Preferences/com.apple.security.libraryvalidation.plist 2>&1
          echo
          echo "installed configuration profiles (MDM-pushed policy, if any):"
          profiles show 2>&1
          echo
          echo "macOS version:"
          sw_vers 2>&1
          echo "::endgroup::"

          # ---- independent baseline: a binary with zero bfnative code in it ----
          # Every diagnostic in this file so far inspects hello_native's own
          # bytes. None of them establish whether ANY freshly-built ad-hoc
          # binary dies on this runner, independent of anything macho.rs
          # writes. Build the simplest possible C program right here with
          # the system's own cc + its own default linker-driven ad-hoc
          # signing (no hand-rolled signature at all), and run it the same
          # way, under the same harness, before touching hello_native.
          echo "::group::independent baseline: bare cc-compiled binary, unrelated to bfnative"
          printf '#include <stdio.h>\nint main(void) { printf("baseline ok\\n"); return 0; }\n' > /tmp/baseline.c
          cc -o /tmp/baseline /tmp/baseline.c
          echo "baseline codesign -dvvv:"
          codesign -dvvv /tmp/baseline 2>&1
          echo "running baseline:"
          /tmp/baseline
          echo "baseline exit code: $?"
          echo "::endgroup::"

          # Every prior round compared hello_native's CodeDirectory/flags
          # against a working binary and found no difference -- three
          # rounds straight. That means the differentiator, if there is
          # one, is somewhere neither codesign nor rcodesign's signature
          # parser looks: the load-command/segment table itself, which
          # the kernel's Mach-O loader reads independently of AMFI's
          # signature check. Dump both with otool -l (full load command
          # detail, not just what validate_macho.py's narrower parser
          # extracts) so a diff is possible instead of eyeballing hex.
          echo "::group::otool -l baseline (known-good ld64 output, full load command dump)"
          otool -l /tmp/baseline 2>&1
          echo "::endgroup::"

          echo "::group::otool -hv baseline (header flags, symbolic)"
          otool -hv /tmp/baseline 2>&1
          echo "::endgroup::"

          cd "$BIN"


          echo "::group::file(1)"
          file tests/hello_native
          echo "::endgroup::"

          echo "::group::otool -l hello_native (full load command dump, diff against baseline's above)"
          otool -l tests/hello_native 2>&1
          echo "::endgroup::"

          echo "::group::otool -hv hello_native (header flags, symbolic)"
          otool -hv tests/hello_native 2>&1
          echo "::endgroup::"

          echo "::group::raw hex dump of LC_CODE_SIGNATURE blob"
          # Locate LC_CODE_SIGNATURE's dataoff/datasize by hand and dump the
          # bytes directly -- this bypasses every Apple tool's interpretation
          # and shows exactly what's on disk, so a wrong-endianness or
          # wrong-offset bug is visible instead of hidden behind a generic
          # "not signed" message.
          python3 - <<'PYEOF'
          import struct
          with open("tests/hello_native", "rb") as f:
              data = f.read()
          magic, cputype, cpusubtype, filetype, ncmds, sizeofcmds, flags = struct.unpack_from('<7I', data, 0)
          print(f"mach_header: magic={magic:#x} ncmds={ncmds} sizeofcmds={sizeofcmds} filesize={len(data)}")
          pos = 32
          dataoff = datasize = None
          for i in range(ncmds):
              cmd, cmdsize = struct.unpack_from('<II', data, pos)
              if cmd == 0x1D:  # LC_CODE_SIGNATURE
                  dataoff, datasize = struct.unpack_from('<II', data, pos + 8)
                  print(f"LC_CODE_SIGNATURE: dataoff={dataoff:#x} datasize={datasize} (cmd #{i} at file offset {pos:#x})")
              pos += cmdsize
          if dataoff is None:
              print("!! no LC_CODE_SIGNATURE load command found at all")
          else:
              print(f"file length vs dataoff+datasize: {len(data)} vs {dataoff+datasize} "
                    f"({'MATCH' if len(data) == dataoff+datasize else 'MISMATCH -- truncated or overrun'})")
              blob = data[dataoff:dataoff+min(datasize, 256)]
              print(f"first {len(blob)} bytes of the signature blob:")
              for off in range(0, len(blob), 16):
                  chunk = blob[off:off+16]
                  hexpart = ' '.join(f'{b:02x}' for b in chunk)
                  print(f"  {dataoff+off:#08x}: {hexpart}")
              magic_be = struct.unpack_from('>I', data, dataoff)[0] if len(data) >= dataoff + 4 else None
              magic_le = struct.unpack_from('<I', data, dataoff)[0] if len(data) >= dataoff + 4 else None
              print(f"SuperBlob magic as BE: {magic_be:#x} (want 0xfade0cc0)  as LE: {magic_le:#x}")
          PYEOF
          echo "::endgroup::"

          echo "::group::rcodesign print-signature-info (independent Rust parser, reports specific structural errors)"
          # apple-codesign's parser is far more diagnostic than Apple's own
          # codesign/spctl, which both collapse every malformed-blob case to
          # the same generic "not signed at all" / "invalid format" message.
          # This either prints the parsed structure (telling us exactly what
          # dataoff/hashOffset/nCodeSlots/etc. it read) or a specific parse
          # error naming the field it choked on.
          if [ "$(uname -m)" = "arm64" ]; then
            RC_URL="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-aarch64-apple-darwin.tar.gz"
          else
            RC_URL="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-apple-darwin.tar.gz"
          fi
          curl -sL -o /tmp/rcodesign.tar.gz "$RC_URL"
          mkdir -p /tmp/rcodesign_extract
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp/rcodesign_extract
          RC=$(find /tmp/rcodesign_extract -name rcodesign -type f | head -1)
          chmod +x "$RC"
          "$RC" print-signature-info tests/hello_native
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::rcodesign print-signature-info on baseline (real ld64 output, for direct exec-segment-field comparison)"
          # Every fix so far (LC_LOAD_DYLINKER, LC_UUID, minos/sdk) was
          # confirmed via otool -l diffing against baseline, but this is
          # the one field group (execSegFlags/execSegBase/execSegLimit,
          # inside the CodeDirectory itself) that only rcodesign surfaces,
          # and it was never run against baseline in any prior round --
          # only against hello_native. Since these are the fields this
          # codebase's own comments say already caused one prior
          # arm64-relevant kernel-rejection bug, get the real ld64
          # baseline for them before guessing again.
          "$RC" print-signature-info /tmp/baseline
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::codesign -dvvv (static signature inspection)"
          codesign -dvvv tests/hello_native
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::codesign --verify --deep --strict --verbose=4 (kernel-equivalent check)"
          codesign --verify --deep --strict --verbose=4 tests/hello_native
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::spctl -a -vv (Gatekeeper assessment)"
          spctl -a -vv tests/hello_native
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::otool -fixup_chains baseline (chained fixups, since baseline has them)"
          otool -fixup_chains /tmp/baseline 2>&1
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::dyld_info baseline (fixups/exports/binds via ld64's own inspector)"
          # Everything the code signature can express (flags, exec-segment
          # fields, blob shape, minos/sdk, LC_UUID) now matches baseline
          # byte-for-byte per the last three rounds of rcodesign diffing,
          # and hello_native still dies. So the signature is very likely
          # not the actual cause -- the AMFI "adhoc signed or unknown
          # cert chain" message may just be what gets logged for *any*
          # image-activation failure at that stage, not the literal
          # reason. The last unexamined structural difference is the bind
          # mechanism itself: baseline uses LC_DYLD_CHAINED_FIXUPS +
          # LC_DYLD_EXPORTS_TRIE (the current, required-on-modern-arm64
          # format), hello_native still emits the legacy
          # LC_DYLD_INFO_ONLY bind-opcode stream. dyld_info shows what
          # ld64 actually encodes there, to compare against by hand.
          if command -v dyld_info >/dev/null 2>&1; then
            dyld_info -fixups -exports /tmp/baseline 2>&1
          else
            echo "dyld_info not present on this runner"
          fi
          echo "::endgroup::"

          echo "::group::otool -fixup_chains hello_native (expect: not applicable, uses LC_DYLD_INFO_ONLY)"
          otool -fixup_chains tests/hello_native 2>&1
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::otool -dyld_info hello_native (decode the legacy bind-opcode stream)"
          otool -dyld_info tests/hello_native 2>&1
          echo "exit: $?"
          echo "::endgroup::"

          echo "::group::control experiment 3: hello_native with signature stripped entirely (unsigned, like x86_64's baseline)"
          # x86_64's baseline has no LC_CODE_SIGNATURE at all and runs
          # fine; the working assumption has been that arm64 requires
          # *some* signature to exec at all (documented Apple behavior).
          # Cheap to actually check rather than keep assuming, now that
          # every signed variant we've tried still dies.
          cp tests/hello_native /tmp/hello_native_unsigned
          codesign --remove-signature /tmp/hello_native_unsigned
          chmod +x /tmp/hello_native_unsigned
          /tmp/hello_native_unsigned
          echo "unsigned hello_native exit code: $?"
          echo "::endgroup::"

          echo "::group::running the binary directly, capturing exit code"
          # Start a *live* log stream before the run, not a post-hoc `log
          # show --start`. log show queries the log database after the
          # fact and can miss or reorder entries depending on flush
          # timing; log stream attaches first and can't lose the window
          # between "process killed" and "message durably written".
          log stream --predicate \
            '(process == "amfid") OR (process == "kernel") OR (subsystem == "com.apple.securityd") OR (process == "taskgated") OR (process == "syspolicyd")' \
            --info --debug > /tmp/live_log_stream.txt 2>&1 &
          LOG_STREAM_PID=$!
          sleep 1  # let log stream actually attach before we run anything
          START_TS=$(date -u +"%Y-%m-%d %H:%M:%S")
          # DYLD_PRINT_* surfaces dyld's own load-time reasoning (library
          # search, binding, segment mapping) independent of whatever
          # AMFI logs -- worth capturing in case the AMFI message is a
          # downstream symptom of a dyld-level rejection rather than the
          # root cause itself.
          DYLD_PRINT_LIBRARIES=1 DYLD_PRINT_APIS=1 DYLD_PRINT_SEGMENTS=1 \
          DYLD_PRINT_BINDINGS=1 DYLD_PRINT_INITIALIZERS=1 \
            ./tests/hello_native
          RUN_EXIT=$?
          echo "run exit code: $RUN_EXIT"
          sleep 1  # let any trailing async log lines land
          kill "$LOG_STREAM_PID" 2>/dev/null
          wait "$LOG_STREAM_PID" 2>/dev/null
          echo "::endgroup::"

          if [ "$RUN_EXIT" -ne 0 ]; then
            echo "::group::live log stream captured during the hello_native run"
            cat /tmp/live_log_stream.txt
            echo "::endgroup::"

            echo "::group::control experiment 2: cc-compiled binary, then ad-hoc re-signed the same way as hello_native's control"
            # Separates two different claims that the single existing
            # control (re-sign hello_native itself) can't distinguish:
            #   (a) "this runner kills ALL codesign -s - re-signed ad-hoc
            #       binaries, regardless of origin" -- if the baseline
            #       above already ran fine un-re-signed but dies here
            #       after a forced re-sign, the act of re-signing itself
            #       (not being ad-hoc per se) is the trigger.
            #   (b) "this runner kills hello_native specifically" -- if
            #       this control runs fine, the earlier hello_native
            #       control result was about hello_native's content, not
            #       ad-hoc signing in general.
            cp /tmp/baseline /tmp/baseline_control
            codesign --remove-signature /tmp/baseline_control
            codesign -s - -f /tmp/baseline_control
            codesign -dvvv /tmp/baseline_control 2>&1
            chmod +x /tmp/baseline_control
            /tmp/baseline_control
            echo "baseline_control exit code: $?"
            echo "::endgroup::"
            echo "::group::control experiment: re-sign with the OS's own codesign, then re-run"
            # Our own writer produces a structurally-verified-correct
            # CodeDirectory (confirmed via rcodesign and manual hex decode
            # against the real struct layout), and codesign --verify
            # reports it valid -- yet the kernel still kills it. Before
            # inventing a fourth theory about our signature bytes, isolate
            # whether this is actually a bytes bug at all: strip our
            # signature and let the OS's own codesign apply a fresh
            # ad-hoc one. If THAT also gets killed, the cause is outside
            # macho.rs entirely (a CI/runner Gatekeeper policy issue, not
            # our signature construction). If it runs fine, our bytes are
            # still wrong in some way rcodesign/codesign --verify don't
            # catch.
            cp tests/hello_native /tmp/hello_native_control
            codesign --remove-signature /tmp/hello_native_control
            codesign -s - -f /tmp/hello_native_control
            echo "control binary codesign -dvvv:"
            codesign -dvvv /tmp/hello_native_control
            chmod +x /tmp/hello_native_control
            /tmp/hello_native_control
            echo "control run exit code: $?"
            echo "::endgroup::"

            echo "::group::log show (kernel/amfid denial reason, since $START_TS)"
            # AMFI/codesigning kills show up in the unified log even when
            # nothing is written to stdout/stderr. --info/--debug widen
            # the net since denial messages are sometimes below default
            # verbosity.
            log show --start "$START_TS" --predicate \
              '(process == "amfid") OR (process == "kernel" AND eventMessage CONTAINS "hello_native") OR (eventMessage CONTAINS "hello_native")' \
              --info --debug 2>&1 | tail -200
            echo "::endgroup::"

            echo "::group::log show (broader taskgated/Security fallback)"
            log show --start "$START_TS" --predicate \
              'subsystem == "com.apple.securityd" OR process == "taskgated" OR process == "syspolicyd"' \
              --info --debug 2>&1 | tail -200
            echo "::endgroup::"

            echo "::group::diagnostic reports (.ips crash logs written for the kill, if any)"
            # AMFI/codesign kills sometimes also produce a structured
            # diagnostic report independent of the unified log -- worth
            # checking since it's a different subsystem's record of the
            # same event and may name a different/more specific reason.
            for dir in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
              echo "-- $dir --"
              find "$dir" -maxdepth 1 -newermt "$START_TS" \( -name '*hello_native*' -o -name '*baseline*' \) -print 2>/dev/null \
                | while read -r report; do
                    echo "== $report =="
                    cat "$report"
                  done
            done
            echo "::endgroup::"
          fi
          set -e

      # Temporary: isolates why bfnative's windows-aarch64 binary gets
      # "Exec format error" (exit 126) -- a loader-level rejection, before
      # any code runs, distinct from the macOS signature failure. dumpbin
      # and a manual PE header parse both bypass Git-bash's interpretation
      # and show exactly what field the Windows loader is choking on.
      - name: debug bfnative windows-arm64 exec format error
        if: always() && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $BIN = "target/aarch64-pc-windows-msvc/release"
          Push-Location $BIN

          # [System.IO.File]::ReadAllBytes resolves relative paths against
          # [Environment]::CurrentDirectory, which Push-Location does NOT
          # update (it only moves PowerShell's own provider location) --
          # so a relative path here silently reads against a stale cwd and
          # throws "Could not find file". Resolve to an absolute path via
          # Get-Location (which Push-Location does update) instead.
          $exePath = Join-Path (Get-Location) "tests/hello_native.exe"

          Write-Host "::group::file size and first bytes"
          Write-Host "resolved exe path: $exePath"
          if (-not (Test-Path $exePath)) {
            Write-Host "FILE DOES NOT EXIST at that path"
          }
          $bytes = [System.IO.File]::ReadAllBytes($exePath)
          Write-Host "file size: $($bytes.Length)"
          Write-Host "first 4 bytes (MZ check): $([System.BitConverter]::ToString($bytes[0..3]))"
          Write-Host "::endgroup::"

          Write-Host "::group::manual PE header parse"
          # Read e_lfanew (offset 0x3C), then walk the COFF header fields
          # by hand -- independent of any OS trust decision, so this shows
          # what's actually on disk regardless of whether the loader
          # accepts it.
          $eLfanew = [System.BitConverter]::ToUInt32($bytes, 0x3C)
          Write-Host "e_lfanew: 0x$($eLfanew.ToString('X'))"
          $peSig = [System.Text.Encoding]::ASCII.GetString($bytes[$eLfanew..($eLfanew+3)])
          Write-Host "PE signature bytes: '$peSig' (want 'PE`0`0')"
          $coffOff = $eLfanew + 4
          $machine = [System.BitConverter]::ToUInt16($bytes, $coffOff)
          Write-Host ("Machine: 0x{0:X4} (want 0xAA64 for ARM64, 0x8664 for AMD64, 0x014C for i386)" -f $machine)
          $numSections = [System.BitConverter]::ToUInt16($bytes, $coffOff + 2)
          Write-Host "NumberOfSections: $numSections"
          $sizeOptHdr = [System.BitConverter]::ToUInt16($bytes, $coffOff + 16)
          Write-Host "SizeOfOptionalHeader: $sizeOptHdr (want 240 for PE32+)"
          $characteristics = [System.BitConverter]::ToUInt16($bytes, $coffOff + 18)
          Write-Host ("Characteristics: 0x{0:X4}" -f $characteristics)
          $optHdrOff = $coffOff + 20
          $magic = [System.BitConverter]::ToUInt16($bytes, $optHdrOff)
          Write-Host ("OptionalHeader magic: 0x{0:X4} (want 0x020B for PE32+)" -f $magic)
          Write-Host "::endgroup::"

          Write-Host "::group::full section table (raw, not via dumpbin -- dumpbin has printed a header with zero fields for section #2 on prior runs)"
          # Section table starts at 0x148, 40 bytes per entry, count = $numSections.
          for ($i = 0; $i -lt $numSections; $i++) {
            $h = 0x148 + 40 * $i
            $secName = [System.Text.Encoding]::ASCII.GetString($bytes[$h..($h+7)]).TrimEnd([char]0)
            $vsize = [System.BitConverter]::ToUInt32($bytes, $h + 8)
            $rva = [System.BitConverter]::ToUInt32($bytes, $h + 12)
            $rawSize = [System.BitConverter]::ToUInt32($bytes, $h + 16)
            $rawOff = [System.BitConverter]::ToUInt32($bytes, $h + 20)
            $secChar = [System.BitConverter]::ToUInt32($bytes, $h + 36)
            Write-Host ("[{0}] name={1} vsize=0x{2:X} rva=0x{3:X} rawsize=0x{4:X} rawoff=0x{5:X} char=0x{6:X8}" -f $i, $secName, $vsize, $rva, $rawSize, $rawOff, $secChar)
          }
          Write-Host "::endgroup::"

          Write-Host "::group::base relocation directory (raw bytes, since this is the newest change and least-tested)"
          # Data directory 5 (BASERELOC) lives at optional-header-offset 112,
          # i.e. file offset $optHdrOff + 112, as an (RVA:u32, Size:u32) pair.
          $direntOff = $optHdrOff + 112 + (5 * 8)
          $relocRva = [System.BitConverter]::ToUInt32($bytes, $direntOff)
          $relocSize = [System.BitConverter]::ToUInt32($bytes, $direntOff + 4)
          Write-Host ("BASERELOC dir: rva=0x{0:X} size=0x{1:X} (size should be a multiple of 4)" -f $relocRva, $relocSize)
          Write-Host ("size % 4 == 0 ? {0}" -f ($relocSize % 4 -eq 0))
          # Map that RVA to a file offset using the section table we just read.
          $relocFileOff = $null
          for ($i = 0; $i -lt $numSections; $i++) {
            $h = 0x148 + 40 * $i
            $vsize = [System.BitConverter]::ToUInt32($bytes, $h + 8)
            $rva = [System.BitConverter]::ToUInt32($bytes, $h + 12)
            $rawOff = [System.BitConverter]::ToUInt32($bytes, $h + 20)
            if ($relocRva -ge $rva -and $relocRva -lt ($rva + $vsize)) {
              $relocFileOff = $rawOff + ($relocRva - $rva)
            }
          }
          if ($relocFileOff -ne $null -and $relocSize -gt 0) {
            $relocBytes = $bytes[$relocFileOff..($relocFileOff + $relocSize - 1)]
            Write-Host "raw .reloc directory bytes: $([System.BitConverter]::ToString($relocBytes))"
            $blockRva = [System.BitConverter]::ToUInt32($bytes, $relocFileOff)
            $blockSize = [System.BitConverter]::ToUInt32($bytes, $relocFileOff + 4)
            Write-Host ("block: page_rva=0x{0:X} size_of_block=0x{1:X} (should be multiple of 4)" -f $blockRva, $blockSize)
          } else {
            Write-Host "could not map BASERELOC rva to a file offset, or size is 0"
          }
          Write-Host "::endgroup::"

          Write-Host "::group::.text raw bytes (real compiled bytes, not a re-derived simulation)"
          # Every prior debug round re-derived the expected .text encoding by
          # hand or via a Python port and disassembled *that*, never the
          # actual bytes this specific CI build produced. Dump the real
          # .text section (raw file bytes) so it can be disassembled against
          # ground truth instead of a re-simulation.
          $textFileOff = $null
          $textRawSize = $null
          for ($i = 0; $i -lt $numSections; $i++) {
            $h = 0x148 + 40 * $i
            $secName = [System.Text.Encoding]::ASCII.GetString($bytes[$h..($h+7)]).TrimEnd([char]0)
            if ($secName -eq ".text") {
              $textRawSize = [System.BitConverter]::ToUInt32($bytes, $h + 16)
              $textFileOff = [System.BitConverter]::ToUInt32($bytes, $h + 20)
            }
          }
          if ($textFileOff -ne $null) {
            # dumpbin /disasm is a much better source of truth than another
            # from-scratch decode -- try it first if available.
            Write-Host "text file offset: 0x$($textFileOff.ToString('X')), raw size: 0x$($textRawSize.ToString('X'))"
            $textBytes = $bytes[$textFileOff..($textFileOff + $textRawSize - 1)]
            Write-Host "raw .text bytes (hex): $([System.BitConverter]::ToString($textBytes))"
          } else {
            Write-Host "could not locate .text section in table"
          }
          Write-Host "::endgroup::"

          Write-Host "::group::dumpbin /disasm (real disassembly of the actual compiled bytes, if dumpbin available)"
          $dumpbinDisasm = Get-Command dumpbin -ErrorAction SilentlyContinue
          if (-not $dumpbinDisasm) {
            $vswhereD = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhereD) {
              $vsPathD = & $vswhereD -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\arm64\dumpbin.exe" | Select-Object -First 1
              if (-not $vsPathD) {
                $vsPathD = & $vswhereD -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
              }
              if ($vsPathD) { & $vsPathD /disasm:bytes $exePath 2>&1 | Select-Object -First 150 }
              else { Write-Host "dumpbin.exe not found via vswhere" }
            } else {
              Write-Host "vswhere.exe not present on this runner"
            }
          } else {
            & dumpbin /disasm:bytes $exePath 2>&1 | Select-Object -First 150
          }
          Write-Host "::endgroup::"

          Write-Host "::group::dumpbin /headers (MSVC's own PE parser, if available)"
          $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
          if ($dumpbin) {
            & dumpbin /headers $exePath 2>&1 | Select-Object -First 120
          } else {
            Write-Host "dumpbin not on PATH -- trying vswhere to locate it"
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
              if ($vsPath) {
                & $vsPath /headers $exePath 2>&1 | Select-Object -First 120
              } else {
                Write-Host "dumpbin.exe not found via vswhere either"
              }
            } else {
              Write-Host "vswhere.exe not present on this runner"
            }
          }
          Write-Host "::endgroup::"

          Write-Host "::group::running the binary directly, capturing exit code and error"
          try {
            $proc = Start-Process -FilePath $exePath -NoNewWindow -Wait -PassThru -RedirectStandardError "stderr.txt" -RedirectStandardOutput "stdout.txt"
            Write-Host "exit code: $($proc.ExitCode)"
          } catch {
            Write-Host "Start-Process threw: $($_.Exception.Message)"
          }
          if (Test-Path "stdout.txt") { Write-Host "stdout:"; Get-Content "stdout.txt" }
          if (Test-Path "stderr.txt") { Write-Host "stderr:"; Get-Content "stderr.txt" }
          Write-Host "::endgroup::"

          Pop-Location

      - name: 8-bit wraparound
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          byte=$(./bfinterp$EXT tests/wrap.bf | od -An -tu1 | tr -d ' ')
          test "$byte" = "0" || { echo "FAIL: expected wraparound to 0, got $byte"; exit 1; }
          echo "PASS: 256 increments wrapped to 0"

      - name: EOF leaves cell untouched
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          byte=$(./bfinterp$EXT tests/eof.bf < /dev/null | od -An -tu1 | tr -d ' ')
          test "$byte" = "3" || { echo "FAIL: expected 3 unchanged, got $byte"; exit 1; }
          echo "PASS: EOF left cell untouched"

      - name: tape grows past 30000 cells
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          byte=$(./bfinterp$EXT tests/grow.bf | od -An -tu1 | tr -d ' ')
          test "$byte" = "1" || { echo "FAIL: expected 1 after growth, got $byte"; exit 1; }
          echo "PASS: tape grew correctly past 30000 cells"

      - name: left-of-zero underflow errors correctly
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          if ./bfinterp$EXT tests/underflow.bf; then
            echo "FAIL: expected nonzero exit code on underflow"
            exit 1
          fi
          echo "PASS: underflow correctly returned nonzero exit"

      - name: --optimize is semantics-preserving
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cd "$BIN"
          for f in tests/hello.bf tests/wrap.bf tests/grow.bf; do
            a=$(./bfinterp$EXT "$f" < /dev/null)
            b=$(./bfinterp$EXT --optimize "$f" < /dev/null)
            test "$a" = "$b" || { echo "FAIL: --optimize changed output for $f"; exit 1; }
          done
          echo "PASS: --optimize matches naive output on all cases"