name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            archive_name: linux-arm64

          - target: x86_64-apple-darwin
            os: macos-26-intel
            archive_name: macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: macos-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: windows-x86_64

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive_name: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      - name: cargo fmt
        shell: bash
        run: cargo fmt --all -- --check

      - name: build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p bfc -p bfrun -p bfnative -p bfinterp -p bfwasm -p bfjit -p bfjs -p bf2c -p bfdbg -p brainfry

      - name: install cargo-llvm-cov
        if: always()
        shell: bash
        run: cargo install cargo-llvm-cov --locked --version 0.9.2

      - name: install nightly coverage toolchain
        if: always()
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal \
            --component llvm-tools-preview \
            --target "${{ matrix.target }}"

      # link.exe's ARM64 padding corrupts LLVM profiles (rust-lang/rust#150123).
      # Use Rust's bundled LLD for coverage while leaving regular MSVC builds unchanged.
      - name: cargo llvm-cov
        if: always()
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-pc-windows-msvc" ]]; then
            export CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=rust-lld
          fi
          # Keep debug-only invariants instrumented in the release coverage build.
          export CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true
          # Keep shared library coverage mappings stable across test binaries.
          export CARGO_PROFILE_RELEASE_LTO=false
          REPORT="coverage-${{ matrix.archive_name }}"
          cargo +nightly llvm-cov --branch --release --workspace --all-targets \
            --target "${{ matrix.target }}" \
            --html --output-dir "$REPORT"

      - name: cargo clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: codesign bfjit for JIT entitlement (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          cat > /tmp/bfjit.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
          </dict>
          </plist>
          EOF
          codesign --sign - --options runtime --entitlements /tmp/bfjit.entitlements --force "$BIN/bfjit"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: install differential test runtimes
        shell: bash
        run: |
          python3 -m pip install wasmtime playwright
          python3 -m playwright install chromium firefox webkit
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            python3 -m playwright install-deps chromium firefox webkit
          fi

      - name: stage native executables for the harness
        shell: bash
        run: |
          # The harness uses target/release locally. Copy this matrix target's
          # binaries there once so the Node-only lanes need no other builds.
          EXE=""
          [[ "${{ matrix.target }}" == *windows* ]] && EXE=".exe"
          SRC="target/${{ matrix.target }}/release"
          mkdir -p target/release
          for bin in bfc bfrun bfnative bfinterp bfjit bfwasm bfjs bf2c bfdbg; do
            cp "$SRC/$bin$EXE" "target/release/$bin$EXE"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: differential test (Node.js 22)
        shell: bash
        run: python3 scripts/differential_test_all.py . --only-node --require-all

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: differential test (Node.js 24)
        shell: bash
        run: python3 scripts/differential_test_all.py . --only-node --require-all

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: full differential and browser test suite (Node.js 26)
        shell: bash
        run: python3 scripts/differential_test_all.py . --require-all

      # Runs after the other checks so a coverage gap doesn't hide their results.
      # A script because cargo-llvm-cov has no --fail-under-branches.
      - name: require 100% coverage
        shell: bash
        run: |
          cargo +nightly llvm-cov report --branch --release \
            --target "${{ matrix.target }}" \
            --json --summary-only --output-path coverage-summary.json
          python3 - <<'EOF'
          import json, sys

          with open("coverage-summary.json") as report:
              totals = json.load(report)["data"][0]["totals"]
          failed = False
          for kind in ("functions", "lines", "regions", "branches"):
              covered, count = totals[kind]["covered"], totals[kind]["count"]
              print(f"{kind}: {covered}/{count}")
              # A zero count means the metric wasn't collected at all.
              if count == 0 or covered != count:
                  print(f"::error::{kind} coverage is below 100% ({covered}/{count})")
                  failed = True
          sys.exit(failed)
          EOF

      # The HTML report doesn't always show where a missed line or region is
      # (the summary can say 671/672 while every row reads as hit), so on
      # failure print the locations straight from the text report.
      - name: show uncovered lines and regions
        if: failure()
        shell: bash
        run: |
          cargo +nightly llvm-cov report --branch --release \
            --target "${{ matrix.target }}" --show-missing-lines
          cargo +nightly llvm-cov report --branch --release \
            --target "${{ matrix.target }}" --text --output-path coverage-text.txt
          python3 - <<'EOF'
          import re

          current_file = last_line = None
          with open("coverage-text.txt", encoding="utf-8", errors="replace") as report:
              for raw in report:
                  line = raw.rstrip("\n")
                  if re.match(r"^\s*\d+\|", line):
                      last_line = line
                      if re.match(r"^\s*\d+\|\s+0\|", line):
                          print(f"::warning::{current_file}: line never ran: {line.strip()}")
                  elif line and not line.startswith((" ", "-")) and line.endswith(":"):
                      current_file = line[:-1]
                  elif "^0" in line:
                      print(f"::warning::{current_file}: region never ran after: {last_line.strip() if last_line else '?'}")
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.archive_name }}
          path: coverage-${{ matrix.archive_name }}/
          if-no-files-found: warn
          retention-days: 30

  wasm-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: install WASI test runtime
        run: python3 -m pip install wasmtime

      - name: build native reference tools
        run: cargo build --release -p bfc -p bfrun

      - name: build unified WASI CLI
        run: cargo build --release --target wasm32-wasip1 -p brainfry

      - name: test WASI CLI and backend workflows
        run: python3 scripts/differential_test_all.py . --only-wasm-cli --require-all
