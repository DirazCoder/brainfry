name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            archive_name: linux-arm64

          - target: x86_64-apple-darwin
            os: macos-26-intel
            archive_name: macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: macos-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: windows-x86_64

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive_name: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy, llvm-tools-preview

      - name: build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p bfc -p bfrun -p bfnative -p bfinterp -p bfwasm -p bfjit -p bfjs -p bf2c -p bfdbg

      - name: install cargo-llvm-cov
        if: always()
        shell: bash
        run: cargo install cargo-llvm-cov --locked --version 0.9.2

      - name: cargo llvm-cov
        if: always()
        shell: bash
        run: |
          REPORT="coverage-${{ matrix.archive_name }}"
          cargo llvm-cov --release --workspace --all-targets \
            --target "${{ matrix.target }}" \
            --json --output-path "$REPORT.json"
          cargo llvm-cov report --release > "$REPORT-table.txt"
          cargo llvm-cov report --release --text --show-missing-lines \
            --output-path "$REPORT-details.txt"

      - name: cargo clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: codesign bfjit for JIT entitlement (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release"
          cat > /tmp/bfjit.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
          </dict>
          </plist>
          EOF
          codesign --sign - --options runtime --entitlements /tmp/bfjit.entitlements --force "$BIN/bfjit"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: install wasmtime (bfwasm lane runtime)
        shell: bash
        run: |
          # Soft dependency: the harness skips the bfwasm lane if this is
          # missing. Warn loudly instead of failing, since not every
          # runner arch necessarily has a wasmtime wheel.
          python3 -m pip install wasmtime \
            || echo "::warning::wasmtime wheel unavailable on ${{ matrix.target }}, bfwasm lane will be skipped"

      - name: run differential test harness
        shell: bash
        run: |
          # The harness looks for binaries under target/release (its
          # layout for a plain `cargo build --release`), but this matrix
          # cross-compiles with --target, which puts them under
          # target/<triple>/release instead. Make the plain path resolve
          # to this run's actual output rather than teaching the script
          # about per-target directories, since it's also used locally.
          EXE=""
          [[ "${{ matrix.target }}" == *windows* ]] && EXE=".exe"
          SRC="target/${{ matrix.target }}/release"
          mkdir -p target/release
          for bin in bfc bfrun bfnative bfinterp bfjit bfwasm bfjs bf2c bfdbg; do
            cp "$SRC/$bin$EXE" "target/release/$bin$EXE"
          done
          python3 scripts/differential_test_all.py .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.archive_name }}
          path: |
            coverage-${{ matrix.archive_name }}.json
            coverage-${{ matrix.archive_name }}-table.txt
            coverage-${{ matrix.archive_name }}-details.txt
          if-no-files-found: warn
          retention-days: 30
