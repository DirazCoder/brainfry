name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            archive_name: linux-arm64

          - target: x86_64-apple-darwin
            os: macos-26-intel
            archive_name: macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: macos-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: windows-x86_64

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive_name: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p bfc -p bfrun -p bfnative -p bfinterp -p bfjit -p bfwasm -p bfjs -p bf2c -p bfdbg -p brainfry

      - name: install 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y 7zip

      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="brainfry-${{ matrix.archive_name }}"
          mkdir "$staging"
          cp target/${{ matrix.target }}/release/bfc "$staging/"
          cp target/${{ matrix.target }}/release/bfrun "$staging/"
          cp target/${{ matrix.target }}/release/bfnative "$staging/"
          cp target/${{ matrix.target }}/release/bfinterp "$staging/"
          cp target/${{ matrix.target }}/release/bfjit "$staging/"
          cp target/${{ matrix.target }}/release/bfwasm "$staging/"
          cp target/${{ matrix.target }}/release/bfjs "$staging/"
          cp target/${{ matrix.target }}/release/bf2c "$staging/"
          cp target/${{ matrix.target }}/release/bfdbg "$staging/"
          cp target/${{ matrix.target }}/release/brainfry "$staging/"
          cp README.md "$staging/"
          sevenzip="$(command -v 7z || command -v 7zz)"
          "$sevenzip" a -mx=9 "Brainfry-0.1.0-${{ matrix.archive_name }}.7z" "$staging"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "brainfry-${{ matrix.archive_name }}"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/bfc.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/bfrun.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/bfnative.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/bfinterp.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/bfjit.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/bfwasm.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/bfjs.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/bf2c.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/bfdbg.exe" $staging/
          Copy-Item "target/${{ matrix.target }}/release/brainfry.exe" $staging/
          Copy-Item README.md $staging/
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          & $sevenZip a -mx=9 "Brainfry-0.1.0-${{ matrix.archive_name }}.7z" $staging

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: Brainfry-0.1.0-${{ matrix.archive_name }}.7z
          archive: false

  wasm-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: build unified WASI CLI
        run: cargo build --release --target wasm32-wasip1 -p brainfry

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Brainfry-wasm32-wasip1
          path: target/wasm32-wasip1/release/brainfry.wasm
          archive: false

  release:
    needs: [build, wasm-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            artifacts/*.7z
            artifacts/*.wasm
